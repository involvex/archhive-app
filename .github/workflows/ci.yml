name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Generate plugins registry
        run: bun run plugins:generate

      - name: Typecheck
        run: bun run typecheck

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install dependencies
        run: bun install

      - name: Generate plugins registry
        run: bun run plugins:generate

      # `bun run test` (vitest) — `bun test` would run Bun's own runner, and
      # these suites rely on vitest's jsdom environment and `vi` helpers.
      - name: Tests
        run: bun run test

  test-rust:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri::generate_context! embeds `frontendDist` at compile time, so the
      # Rust crate cannot be checked or tested without a built `dist/`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install frontend dependencies
        run: bun install

      - name: Generate plugins registry
        run: bun run plugins:generate

      - name: Build frontend (needed for tauri context)
        run: bunx vite build

      # `tauri::generate_context!` also embeds the yt-dlp / ffmpeg sidecars as
      # resources; without the files the Rust build script fails with
      # "resource path `binaries/yt-dlp-x86_64-unknown-linux-gnu` doesn't exist".
      - name: Download sidecar binaries (needed for tauri context)
        run: bash scripts/setup-binaries.sh x86_64-unknown-linux-gnu

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Warnings stay warnings: the crate carries known dead-code lints for
      # desktop-only/mobile-only code paths. Errors fail the job.
      - name: Clippy
        run: cd src-tauri && cargo clippy --all-targets

      - name: Tests
        run: cd src-tauri && cargo test --lib

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install dependencies
        run: bun install

      - name: Bun audit
        run: bun audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cargo audit
        run: cd src-tauri && cargo audit
