# cargo-audit configuration
# Run: cargo audit
# Docs: https://doc.rustsec.org/cargo-audit/

# The following advisories are from Tauri framework transitive dependencies
# and cannot be resolved without upstream Tauri updates. All are warnings,
# not vulnerabilities (0 vulnerabilities in the current dependency tree).

# RUSTSEC-2024-0370: proc-macro-error is unmaintained.
# Pulled in by glib-macros -> glib (Linux GTK backend via Tauri).
# Not a security risk; no known exploits in this context.
[[advisories]]
id = "RUSTSEC-2024-0370"
ignored = true
reason = "Transitive dependency via Tauri GTK backend (Linux only)"

